<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      max-width: 640px;
      margin: 2em auto;
      padding: 0 1em;
      color: #202124;
    }
    h1 { color: #1a73e8; margin-bottom: 0.2em; }
    .subtitle { color: #5f6368; margin-top: 0; }
    .drop-zone {
      display: block;
      border: 2px dashed #1a73e8;
      border-radius: 12px;
      padding: 3em 1em;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      margin: 1.5em 0;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      background: #e8f0fe;
      border-color: #174ea6;
    }
    .drop-zone input { display: none; }
    .drop-zone .big { font-size: 1.2em; font-weight: 500; }
    .drop-zone .small { color: #5f6368; font-size: 0.9em; margin-top: 0.5em; }
    .status {
      margin-top: 1em;
      padding: 1em 1.2em;
      border-radius: 8px;
      line-height: 1.6;
    }
    .status.success { background: #e6f4ea; color: #1e8e3e; }
    .status.error   { background: #fce8e6; color: #c5221f; }
    .status.loading { background: #e8f0fe; color: #1a73e8; }
    .status a { color: inherit; font-weight: 500; }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #1a73e8;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>成績 PDF → 試算表</h1>
  <p class="subtitle">拖入學生作業 PDF,Gemini 會辨識紅筆分數並自動建立 Google 試算表。</p>

  <label class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept="application/pdf">
    <div class="big">拖入 PDF 或點擊選擇檔案</div>
    <div class="small">支援多頁掃描 PDF,處理時間約 30 秒~2 分鐘</div>
  </label>

  <div id="status"></div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const statusEl = document.getElementById('status');

    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', e => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      if (!/\.pdf$/i.test(file.name)) {
        setStatus('error', '✗ 請上傳 PDF 檔');
        return;
      }
      if (file.size > 45 * 1024 * 1024) {
        setStatus('error', '✗ 檔案超過 45 MB,Apps Script 無法處理');
        return;
      }

      setStatus('loading',
        `<span class="spinner"></span>處理中:<b>${escapeHtml(file.name)}</b>(請勿關閉此頁)`);
      fileInput.value = '';

      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(',')[1];
        google.script.run
          .withSuccessHandler(result => {
            setStatus('success',
              `✓ 完成!共辨識 <b>${result.count}</b> 個紅色分數<br>` +
              `<a href="${result.sheetUrl}" target="_blank">→ 開啟試算表</a>`);
          })
          .withFailureHandler(err => setStatus('error', '✗ 失敗:' + err.message))
          .processUploadedPDF(base64, file.name);
      };
      reader.onerror = () => setStatus('error', '✗ 讀檔失敗');
      reader.readAsDataURL(file);
    }

    function setStatus(type, html) {
      statusEl.className = 'status ' + type;
      statusEl.innerHTML = html;
    }
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
